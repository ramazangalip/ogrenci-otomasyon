<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Arka Plan (Squircle / Yuvarlatılmış Kare) -->
  <rect width="512" height="512" rx="115" fill="#0f2b48" />
  
  <!-- İç Dairesel Zemin -->
  <circle cx="256" cy="256" r="190" fill="#f4f8fa" />
  
  <!-- Mavi Alt Grafik Çizgisi -->
  <path d="M 120 330 L 195 240 L 255 310 L 370 170" 
        fill="none" stroke="#1b6080" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- İkinci Katman Grafik / Kalem Gövdesi (Turuncu Vurgu) -->
